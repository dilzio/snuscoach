[project]
name = "snuscoach"
version = "0.1.0"
description = "Personal AI coach for navigating corporate office politics."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "python-dotenv>=1.0.0",
    "nicegui>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "playwright>=1.44", "pytest-playwright>=0.5"]

[project.scripts]
snuscoach = "snuscoach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: Playwright browser integration tests (require live server)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snuscoach*"]
